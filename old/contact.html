<hr>
 <header>
 <h1>Mettiti in Contatto</h1>
 <p>Compila il modulo sottostante per inviarmi un messaggio diretto.</p>
 </header>
 <main>
 <section>
 <!-- Modulo di Contatto Semplice -->
 <form action="#" method="POST">
 <!-- Campo Nome -->
 <div>
 <label for="nome">Nome Completo:</label><br>
 <input type="text" id="nome" name="nome" placeholder="Inserisci il 
tuo nome" required>
 </div>
 <br>
 <!-- Campo Email -->
 <div>
 <label for="email">Indirizzo Email:</label><br>
 <input type="email" id="email" name="email" 
placeholder="esempio@dominio.com" required>
 </div>
 <br>
 <!-- Campo Messaggio -->
 <div>
 <label for="messaggio">Il tuo Messaggio:</label><br>
 <textarea id="messaggio" name="messaggio" rows="5" cols="30" 
placeholder="Scrivi qui il tuo messaggio..." required></textarea>
 </div>
 <br>
 <!-- Pulsanti di Invio e Reset -->
 <div>
 <button type="submit">Invia Messaggio</button>
 <button type="reset">Svuota Campi</button>
 </div>
 </form>
 </section>
 <!-- Collegamento per tornare indietro -->
 <section>
 <br>
 <p><a href="index.html">&larr; Torna alla Home Page</a></p>
 </section>
 </main>

 </footer>
</body>
</html>
