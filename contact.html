<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contattami - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-viola">

    <header class="page-header">
        <a href="index.html" class="back-link">&larr; Torna alla Home</a>
        <h1>Mettiti in Contatto</h1>
        <p>Compila il modulo sottostante per inviarci un messaggio diretto.</p>
    </header>

    <main class="page-content">
        <section class="form-container">
            <form id="form-contatti" class="styled-form">

                <div id="messaggio-esito"
                    style="margin-bottom: 15px; font-weight: bold; text-align: center; font-size: 1.1rem;">

                </div>
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Inserisci il tuo nome" required>
                </div>

                <div class="form-group">
                    <label for="email">Indirizzo Email:</label>
                    <input type="email" id="email" name="email" placeholder="esempio@dominio.com" required>
                </div>

                <div class="form-group">
                    <label for="messaggio">Il tuo Messaggio:</label>
                    <textarea id="messaggio" name="messaggio" rows="5" placeholder="Scrivi qui il tuo messaggio..."
                        required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Invia Messaggio</button>
                    <button type="reset" class="btn-reset">Svuota Campi</button>
                </div>

            </form>
        </section>
    </main>
    <script src="validazione.js"></script>
</body>

</html>
